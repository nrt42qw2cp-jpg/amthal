<title>قاموس الأمثال · Proverbs Dictionary</title>
<style>

:root[data-theme="dark"]{--bg:#17130e;--card:#211b14;--ink:#f1e8d6;--mute:#a89a82;--acc:#5fc2a7;--gold:#d9a94a;--line:#382f22;--ok:#5fd09a;--near:#e8a255;--mean:#93a6cc}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px;position:relative}
.orn{text-align:center;color:var(--gold);letter-spacing:.6em;font-size:12px}
header{text-align:center;margin:8px 0 20px}
.logo{width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--bg);display:inline-grid;place-items:center;font-size:24px;font-weight:700;margin:8px 0}
h1{margin:4px 0;font-size:26px;color:var(--acc)}
.name{font-weight:700}.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
/* landing */
#land{text-align:center}
#land h2{margin:18px 0 6px;font-size:20px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.choice{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:26px 10px;cursor:pointer;color:var(--ink);font:inherit;transition:.15s}
.choice:hover,.choice:focus-visible{border-color:var(--gold);transform:translateY(-2px);outline:none}
.choice b{display:block;font-size:26px;color:var(--acc)}
.choice span{font-size:13px;color:var(--mute)}
/* app */
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.bar input{flex:1;min-width:140px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.btn.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.count{color:var(--mute);font-size:13px}
.idx{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.idx a{flex:none;min-width:34px;text-align:center;padding:5px 8px;border:1px solid var(--line);border-radius:8px;color:var(--acc);text-decoration:none;background:var(--card);font-weight:600}
.letter{font-size:22px;color:var(--gold);margin:22px 0 4px;border-bottom:1px solid var(--line);font-weight:700}
.p{font-size:18px;font-weight:700;margin-bottom:6px}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid currentColor;margin-inline-end:6px}
.ok{color:var(--ok)}.near{color:var(--near)}.mean{color:var(--mean)}
.tag{color:var(--mute);font-size:12px}
.row{margin-top:6px}.lbl{color:var(--mute);font-size:13px}
.eq{font-size:16px}
.en{direction:ltr;text-align:left;unicode-bidi:isolate}
.ar{direction:rtl;text-align:right;unicode-bidi:isolate}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px;font-size:13px}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.hide{display:none}
.grp{margin:18px 0 6px;text-align:start}.grp .lbl2{font-weight:700;margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 8px;font:inherit;font-size:20px;font-weight:700;color:var(--ink);cursor:pointer}
.seg button.on{border-color:var(--gold);color:var(--acc);background:var(--bg)}
.swap{display:block;margin:10px auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--acc);font-size:20px;cursor:pointer}
#go{width:100%;margin-top:18px;padding:14px;font-size:18px}
.contact{margin-top:48px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);text-align:center;line-height:1.9}
.contact a{color:var(--acc);text-decoration:none}
.contact .ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

#menuBtn{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;cursor:pointer;z-index:5}
.menu{position:absolute;right:12px;top:58px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:210px;z-index:6;box-shadow:0 8px 24px #0003;overflow:hidden}
.menu button{display:block;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:start;cursor:pointer}
#mod{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:20;padding:16px}
#mod.hide{display:none}
.mbox{position:relative;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:88vh;overflow:auto}
.mbox h2{margin:0 0 10px;color:var(--acc);font-size:20px}.mbox h3{font-size:15px;margin:14px 0 4px}
.mbox input,.mbox select,.mbox textarea{width:100%;margin:5px 0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.mbox textarea{min-height:60px}.mbox label{font-size:13px;color:var(--mute)}.mbox .full{width:100%;margin-top:8px}
.x{position:absolute;inset-inline-end:10px;top:10px;border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer}
.it{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.bad{color:#c0392b;font-size:13px;margin:6px 0}.mbox .ok{font-size:13px;margin:6px 0}
.danger{color:#c0392b;border-color:#c0392b}
.authbox{display:flex;gap:10px;margin-top:14px}.authbox .btn{flex:1}
</style>
</head>

</div>

ar:{dir:"rtl",title:"قاموس الأمثال العربية",ph:"ابحث في الأمثال…",rnd:"🎲 مثل عشوائي",sw:"🌐 تغيير اللغة",n:" مثل",none:"لا توجد نتائج",
 m:"✓ مطابق",c:"⚠ قريب",o:"ⓘ معنى فقط",lm:"المرادف بالإنجليزي",lc:"أقرب مرادف",lo:"ما له مرادف — المعنى",lmean:"المعنى",tc:"شائع",tg:"سعودي / خليجي",leg:"دليل الألوان"},

};

function norm(s){return s.replace(/[أإآ]/g,"ا").replace(/[ًٌٍَُِّْ]/g,"")}
function letterAr(s){s=norm(s);return (s.replace(/^ال(?!لي)/,"")||s).charAt(0)}
function letterEn(s){return s.replace(/^(a|an|the)\s+/i,"").charAt(0).toUpperCase()}
